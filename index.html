<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Breakout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app-layout">

  <div id="game-wrap">

    <!-- HUD -->
    <div id="hud">
      <div class="hud-item">
        <span>Уровень</span>
        <strong id="level">1</strong>
      </div>

      <div class="hud-item">
        <span>Жизни</span>
        <strong id="lives">3</strong>
      </div>

      <div class="hud-item">
        <span>Лучший</span>
        <strong id="best">1</strong>
      </div>

      <button id="muteBtn" type="button">🔊</button>
    </div>

    <!-- GAME -->
    <canvas id="game" width="800" height="600"></canvas>

    <!-- START / GAME OVER OVERLAY -->
    <div id="overlay">
      <div class="overlay-card">

        <h1 id="overlayTitle">NEON BREAKOUT</h1>

        <p id="overlaySubtitle">
          Разбей все блоки и доберись до следующего уровня
        </p>

        <div class="start-buttons">
          <button id="startBtn" type="button">
            🎮 Играть
          </button>

          <button id="developerBtn" type="button" class="dev-btn">
            🛠 Developer
          </button>
        </div>

        <div class="hint" id="overlayHint">
          Управление: ← → / A D / мышь / касание
        </div>

      </div>
    </div>

    <!-- BUFFS -->
    <div id="buffsWrap"></div>

  </div>

  <!-- DEVELOPER PANEL: вынесена за пределы game-wrap, чтобы не перекрывать
       игровое поле. Отдельная колонка сбоку, а не оверлей поверх канваса. -->
  <div id="devPanel" class="dev-panel hidden">

    <div class="dev-title-row">
      <div class="dev-title">🛠 DEVELOPER MODE</div>
      <button id="devCloseX" type="button" class="dev-close-x" title="Закрыть">✕</button>
    </div>

    <div class="dev-section">

      <label>
        Уровень

        <input
          id="devLevelInput"
          type="number"
          min="1"
          max="9999"
          value="1"
        >
      </label>

      <button id="devLoadLevel" type="button">
        Загрузить уровень
      </button>

    </div>

    <div class="dev-row">

      <button id="devPrevLevel" type="button">
        ← Назад
      </button>

      <button id="devNextLevel" type="button">
        Вперёд →
      </button>

    </div>

    <div class="dev-row">

      <button id="devRestart" type="button">
        ↻ Restart
      </button>

      <button id="devSkip" type="button">
        ⏭ Skip
      </button>

    </div>

    <div class="dev-section">

      <label class="dev-checkbox">
        <input
          id="devInfiniteLives"
          type="checkbox"
          checked
        >

        <span>∞ Бесконечные жизни</span>
      </label>

      <label class="dev-checkbox">
        <input
          id="devGodMode"
          type="checkbox"
        >

        <span>🛡 God Mode</span>
      </label>

      <label class="dev-checkbox">
        <input
          id="devHitboxes"
          type="checkbox"
        >

        <span>▣ Show Hitboxes</span>
      </label>

      <label class="dev-checkbox">
        <input
          id="devSlowMotion"
          type="checkbox"
        >

        <span>🐌 Slow Motion</span>
      </label>

    </div>

    <div class="dev-section">

      <label>
        Частота боссов

        <select id="devBossFrequency">

          <option value="2">
            Каждые 2 уровня
          </option>

          <option value="3">
            Каждые 3 уровня
          </option>

          <option value="5" selected>
            Каждые 5 уровней
          </option>

          <option value="10">
            Каждые 10 уровней
          </option>

          <option value="random">
            Random
          </option>

        </select>

      </label>

    </div>

    <!-- Принудительная активация/деактивация бонусов для тестирования -->
    <div class="dev-section">
      <div class="dev-subtitle">Принудительные бонусы</div>

      <div class="dev-row">
        <button id="devForceBig" type="button">🟢 Big</button>
        <button id="devForceFire" type="button">🔥 Fire</button>
      </div>
      <div class="dev-row">
        <button id="devForceMulti" type="button">⚪ Multi</button>
        <button id="devForceSlow" type="button">🔵 Slow</button>
      </div>
      <div class="dev-row">
        <button id="devForceShrink" type="button">🔴 Shrink</button>
      </div>
      <label class="dev-checkbox">
        <input
          id="devBonusesDisabled"
          type="checkbox"
        >
        <span>🚫 Отключить выпадение бонусов</span>
      </label>
    </div>

    <button
      id="devExit"
      type="button"
      class="dev-exit"
    >
      ← Выйти из Developer
    </button>

  </div>

  </div>

  <script src="game.js?v=3"></script>

</body>
</html>
